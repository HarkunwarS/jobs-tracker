name: Ireland Job Tracker — Production Discovery
on:
  schedule:
    - cron: "17 8,14,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-tracker-production-state
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests before state mutation
        run: |
          python test_v6.py
          python -m unittest discover -s tests -v
          python scripts/production_verify.py
      - name: Fetch and queue newly discovered jobs
        id: prepare
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python run.py --prepare
      - name: Upload prepared state for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-state-${{ github.run_id }}
          path: |
            data/seen_jobs.json
            data/notification_outbox.json
            data/discovery_state.json
          retention-days: 30
      - name: Commit state before any delivery
        run: python scripts/persist_state.py main
      - name: Check signed channel grants and available credentials
        id: gate
        if: steps.prepare.outputs.bootstrapped != 'true'
        env:
          NOTIFICATION_APPROVAL_PUBLIC_KEY_B64: ${{ secrets.NOTIFICATION_APPROVAL_PUBLIC_KEY_B64 }}
          EMAIL_APPROVAL_GRANT_B64: ${{ secrets.EMAIL_APPROVAL_GRANT_B64 }}
          TELEGRAM_APPROVAL_GRANT_B64: ${{ secrets.TELEGRAM_APPROVAL_GRANT_B64 }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notification_gate.py
      - name: Deliver bounded queued alerts
        if: steps.gate.outputs.enabled == 'true'
        env:
          NOTIFICATION_APPROVAL_PUBLIC_KEY_B64: ${{ secrets.NOTIFICATION_APPROVAL_PUBLIC_KEY_B64 }}
          EMAIL_APPROVAL_GRANT_B64: ${{ secrets.EMAIL_APPROVAL_GRANT_B64 }}
          TELEGRAM_APPROVAL_GRANT_B64: ${{ secrets.TELEGRAM_APPROVAL_GRANT_B64 }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py --deliver
      - name: Save delivery receipts (or preserve failures)
        if: steps.gate.outputs.enabled == 'true' && always()
        run: python scripts/persist_state.py main
      - name: Execution summary
        if: always()
        run: |
          echo "## Job Tracker discovery" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID | Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"