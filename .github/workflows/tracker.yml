name: Phase 4 Isolated Staging Tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase4-staging-offline
  cancel-in-progress: false
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (no job-source queries)
        run: python -m pip install -r requirements.txt
      - name: Validate read-only staging
        run: |
          python scripts/staging_verify.py
          python run.py --dry-run
          python test_v6.py
          python -m unittest discover -s tests -v