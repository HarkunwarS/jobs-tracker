name: Phase 4 Events Disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  events-safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm event delivery disabled
        run: python scripts/staging_verify.py