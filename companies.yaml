# ════════════════════════════════════════════════════════════════════════════
#  Job Tracker v5 — Curated Company List
#  Hand-verified Ireland-relevant employers, organised by ATS.
#
#  Add companies here. The bot probes each ATS endpoint, so a wrong slug
#  just fails silently (logged as a warning) — it won't break the run.
#
#  How to find a company's ATS slug:
#    Greenhouse:  https://boards.greenhouse.io/<slug>
#    Lever:       https://jobs.lever.co/<slug>
#    Ashby:       https://jobs.ashbyhq.com/<slug>
#    Workable:    https://apply.workable.com/<slug>/
#    SmartRec:    https://jobs.smartrecruiters.com/<slug>
#    Personio:    https://<slug>.jobs.personio.de/
#    Workday:     varies — see workday_tenants section
#
#  Most companies tell you the slug just by visiting their careers page
#  and copying it from the URL.
# ════════════════════════════════════════════════════════════════════════════

