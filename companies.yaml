# ── Workday ─────────────────────────────────────────────────────────────────
# Workday is per-tenant — each company has its own subdomain. The bot calls
# https://<tenant>.wd<N>.myworkdayjobs.com/<external_path>/jobs to fetch jobs.
# Format:  CompanyName: [tenant, wd_number, external_path]
# Find these by going to a company's careers page and copying from the URL.
workday_tenants:
  Accenture:         [accenture,        3, Accenture_Careers]
  Microsoft:         [microsoft,        1, Microsoft]
  Salesforce:        [salesforce,       1, External_Career_Site]
  Workday Inc.:      [workday,          5, Workday]
  AIB:               [aib,              3, AIB_External_Careers]
  Bank of Ireland:   [boi,              3, BOI_Careers]
  Aviva:             [aviva,            3, External]
  Aer Lingus:        [aerlingus,        3, External]
  Ryanair:           [ryanair,          3, External]
  Glanbia:           [glanbia,          3, External]
  ESB:               [esb,              3, ESB]
  Kerry Group:       [kerry,            3, External]
  Pfizer:            [pfizer,           3, PfizerCareers]
  J&J:               [jnj,              3, jnjcareers]
  MSD:               [merck,            3, SearchJobs]
  Medtronic:         [medtronic,        5, External]
  Boston Scientific: [bostonscientific, 3, External]
  Stryker:           [stryker,          1, Stryker_Careers]
  Abbvie:            [abbvie,           5, External]
  EY:                [ey,               3, EY_Careers]
  Deloitte:          [deloitte,         3, Deloitte_Careers]
  KPMG:              [kpmg,             3, KPMG_Careers]
  PwC:               [pwc,              3, Global_Experienced_Careers]
  Mastercard:        [mastercard,       1, CorporateCareers]

# ── Direct grad programme pages ─────────────────────────────────────────────
# These don't fit any standard ATS — we just check the page for changes.
# (Implemented in sources/direct.py — included for visibility.)

# ── Jibe / iCIMS career sites (NEW v6) ──────────────────────────────────────
# Custom career sites built on Jibe expose JSON at https://<host>/api/jobs
# This is what Susquehanna (SIG) uses — the job you found manually.
jibe:
  Susquehanna (SIG): careers.sig.com

# NOTE (v6): `direct_grad_pages` from v5 had no fetcher and was silently
# ignored — removed. If you want a company with no public ATS endpoint,
# check whether their careers site is Jibe-powered (view-source and look
# for jibecdn.com), else rely on the LinkedIn/Jooble sweeps to catch them.
