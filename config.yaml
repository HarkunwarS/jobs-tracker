# ════════════════════════════════════════════════════════════════════════════
#  Job Tracker v5 — User Config
# ════════════════════════════════════════════════════════════════════════════

# ── Geographic scope ────────────────────────────────────────────────────────
locations:
  ireland: true            # Cork, Dublin, Galway, Limerick, Waterford, etc.
  eu_remote: true          # "Remote — EU" / "Remote — Europe"
  remote_anywhere: true    # Fully remote, any country
  visa_sponsoring: true    # Non-Ireland locations — ONLY kept if description
                           # explicitly mentions visa sponsorship (see filters.py)

# Europe: countries that regularly sponsor non-EU tech workers
visa_sponsor_countries_europe:
  - united kingdom
  - uk
  - england
  - scotland
  - germany
  - netherlands
  - amsterdam
  - berlin
  - munich
  - london
  - manchester
  - edinburgh
  - poland
  - spain
  - portugal
  - france
  - sweden
  - denmark
  - finland
  - norway
  - belgium
  - luxembourg
  - switzerland
  - austria

# Asia: target countries — Singapore, Malaysia, Japan, South Korea, etc.
visa_sponsor_countries_asia:
  - singapore
  - malaysia
  - kuala lumpur
  - japan
  - tokyo
  - osaka
  - south korea
  - korea
  - seoul
  - hong kong
  - taiwan
  - taipei
  - thailand
  - bangkok
  - vietnam
  - ho chi minh
  - hanoi
  - indonesia
  - jakarta
  - philippines
  - manila
  - dubai
  - abu dhabi
  - uae
  - united arab emirates

# ── Visa sponsorship detection ───────────────────────────────────────────────
# Jobs outside Ireland are ONLY included if their description contains
# at least one of these phrases. This prevents the tracker from sending
# you jobs where the company has no intention of sponsoring you.
visa_sponsorship_phrases:
  - "visa sponsorship"
  - "we sponsor"
  - "will sponsor"
  - "sponsorship provided"
  - "visa support"
  - "work permit"
  - "relocation support"
  - "relocation assistance"
  - "relocation package"
  - "right to work not required"
  - "right to work is not required"
  - "no right to work required"
  - "open to relocation"
  - "we welcome applicants"
  - "sponsorship available"
  - "sponsor the right candidate"
  - "global mobility"
  - "employment pass"        # Singapore-specific
  - "ep application"         # Singapore EP
  - "work visa"
  - "work authorisation"
  - "work authorization"
  - "immigration support"

