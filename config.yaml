# ════════════════════════════════════════════════════════════════════════════
#  Job Tracker v5 — User Config
#  Edit this file to change behaviour without touching Python code.
# ════════════════════════════════════════════════════════════════════════════

# ── Geographic scope ────────────────────────────────────────────────────────
# Jobs matching ANY of these location filters will be kept.
locations:
  ireland: true            # Cork, Dublin, Galway, Limerick, Waterford, etc.
  eu_remote: true          # "Remote — EU" / "Remote — Europe"
  remote_anywhere: true    # Fully remote, any country
  visa_sponsoring: true    # Match on visa-sponsor keywords (UK, Germany, NL, etc.)

# Countries other than Ireland/India we'll accept if visa_sponsoring is on.
# These all routinely sponsor non-EU workers for tech roles.
visa_sponsor_countries:
  - united kingdom
  - uk
  - england
  - scotland
  - germany
  - netherlands
  - amsterdam
  - berlin
  - munich
  - london
  - manchester
  - edinburgh
  - poland
  - spain
  - portugal
  - france
  - sweden
  - denmark
  - finland
  - norway
  - belgium
  - luxembourg
  - switzerland
  - austria

