# ════════════════════════════════════════════════════════════════════════════
#  Job Tracker v6 — User Config
#
#  Philosophy change vs v5: there is NO role allowlist anymore. The tracker
#  rejects clearly-senior roles and clearly-irrelevant sectors (see
#  sources/filters.py), keeps every other early-career job in scope, and
#  lets the CV-similarity score rank them. Broaden/narrow by editing the
#  reject patterns in filters.py, not by adding keywords here.
# ════════════════════════════════════════════════════════════════════════════

# ── Geographic scope ────────────────────────────────────────────────────────
locations:
  ireland: true            # always in scope, no sponsorship check
  eu_remote: true
  remote_anywhere: true
  visa_sponsoring: true    # non-Ireland: needs sponsorship evidence
                           # (description phrase OR source flag like Arbeitnow)

visa_sponsor_countries_europe:
  - united kingdom
  - uk
  - england
  - scotland
  - london
  - manchester
  - edinburgh
  - germany
  - berlin
  - munich
  - netherlands
  - amsterdam
  - poland
  - spain
  - portugal
  - france
  - sweden
  - denmark
  - finland
  - norway
  - belgium
  - luxembourg
  - switzerland
  - austria

visa_sponsor_countries_asia:
  - singapore
  - malaysia
  - kuala lumpur
  - japan
  - tokyo
  - osaka
  - south korea
  - seoul
  - hong kong
  - taiwan
  - taipei
  - thailand
  - bangkok
  - vietnam
  - indonesia
  - jakarta
  - philippines
  - manila
  - dubai
  - abu dhabi
  - uae
  - united arab emirates

visa_sponsorship_phrases:
  - "visa sponsorship"
  - "we sponsor"
  - "will sponsor"
  - "sponsorship provided"
  - "sponsorship available"
  - "sponsor the right candidate"
  - "visa support"
  - "work permit"
  - "relocation support"
  - "relocation assistance"
  - "relocation package"
  - "right to work not required"
  - "right to work is not required"
  - "no right to work required"
  - "open to relocation"
  - "global mobility"
  - "employment pass"
  - "ep application"
  - "work visa"
  - "work authorisation"
  - "work authorization"
  - "immigration support"
  - "skilled worker visa"
  - "tier 2"

# ── Filtering ───────────────────────────────────────────────────────────────
filtering:
  # Keep jobs whose title carries no seniority signal at all (many genuine
  # entry-level jobs are just "Data Analyst"). Scoring ranks them.
  include_unspecified_seniority: true

# ── Keywords (for SEARCH-based sources only — not a filter) ────────────────
keywords:
  # LinkedIn Ireland sweep — broad on purpose
  linkedin_ireland:
    - graduate
    - graduate programme
    - junior
    - intern
    - software engineer
    - data analyst
    - data scientist
    - data engineer
    - machine learning
    - business analyst
    - supply chain
    - project manager
    - ai trainer
    - devops
  # Short list for abroad locations (visa gate applies there)
  linkedin_abroad:
    - graduate programme visa sponsorship
    - software engineer visa sponsorship
    - data analyst visa sponsorship
  # Queries for Jooble (Ireland) and Adzuna (abroad)
  aggregator_queries:
    - graduate
    - junior
    - data analyst
    - software engineer
    - business analyst
    - supply chain graduate
    - project coordinator

linkedin:
  window_hours: 3          # search window; > run cadence so gaps can't open
  detail_fetch_cap: 15     # max description fetches per run (visa candidates)
  abroad_locations:
    - United Kingdom
    - Germany
    - Netherlands
    - Singapore
    - United Arab Emirates

gradireland:
  pages: 3                 # newest ~36 listings per run

aggregators:
  jooble: true             # needs JOOBLE_API_KEY secret (free)
  adzuna: true             # needs ADZUNA_APP_ID + ADZUNA_APP_KEY (free)
  adzuna_countries: [gb, de, nl, sg]
  arbeitnow: true          # keyless; visa-sponsor jobs, pre-verified
  remotive: true           # keyless; remote jobs
  remoteok: true           # keyless; remote jobs

# ── Relevance scoring & routing ─────────────────────────────────────────────
scoring:
  cv_text_file: "data/cv_text.txt"
  telegram_thresholds:
    ireland: 0.44          # lower bar — an Ireland match is worth pinging
    default: 0.52
  email_floor: 0.28        # below this, jobs are dropped to keep email sane
  max_telegram_per_run: 10

notifications:
  email:
    enabled: true
  telegram:
    enabled: true

# ── Networking events (weekly digest, events_run.py) ────────────────────────
events:
  days_ahead: 45
  gradireland_events: true
  meetup_groups:           # public iCal feeds, no API key
    - cork-ai
    - corkdevs
    - Cork-Big-Data-Analytics-Group
    - pythonireland
    - DublinAI
