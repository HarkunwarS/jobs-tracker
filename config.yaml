# ── Seniority filter ────────────────────────────────────────────────────────
reject_if_title_contains:
  - senior
  - sr.
  - staff engineer
  - staff software
  - staff data
  - principal
  - director
  - vp
  - vice president
  - head of
  - chief
  - distinguished
  - 5+ years
  - 7+ years
  - 10+ years
  - "experienced "

reject_phrases:
  - "senior software"
  - "senior data"
  - "senior engineer"
  - "senior developer"
  - "engineering manager"
  - "lead engineer"
  - "lead developer"
  - "lead data"

# ── Relevance scoring ───────────────────────────────────────────────────────
scoring:
  telegram_threshold: 0.48
  max_telegram_per_run: 10
  cv_text_file: "data/cv_text.txt"

# ── Notification routing ────────────────────────────────────────────────────
notifications:
  email:
    enabled: true
    daily_digest_hour: 8
    instant_runs: true
  telegram:
    enabled: true
    only_above_threshold: true
