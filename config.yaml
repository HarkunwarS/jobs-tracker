# ── Seniority filter ────────────────────────────────────────────────────────
# We REJECT jobs whose title contains these (case-insensitive whole-word).
# Note: "lead" and "manager" alone are NOT here because some grad programmes
# include them legitimately (e.g. "Team Lead - Graduate", "Project Manager
# Graduate Programme"). They're soft-flagged instead via the matcher.
reject_if_title_contains:
  - senior
  - sr.
  - staff engineer
  - staff software
  - staff data
  - principal
  - director
  - vp
  - vice president
  - head of
  - chief
  - distinguished
  - 5+ years
  - 7+ years
  - 10+ years
  - "experienced "

# Strong seniority signals (always reject) — multi-word phrases only,
# avoids the false positives from substring matching
reject_phrases:
  - "senior software"
  - "senior data"
  - "senior engineer"
  - "senior developer"
  - "engineering manager"
  - "lead engineer"
  - "lead developer"
  - "lead data"

# ── Relevance scoring ───────────────────────────────────────────────────────
# Top tier = WhatsApp/Telegram instant alert. Everything else = email digest.
scoring:
  telegram_threshold: 0.55     # cosine similarity threshold (0-1, lower = more matches)
  max_telegram_per_run: 5      # cap on instant alerts per hourly run
  cv_text_file: "data/cv_text.txt"   # plain text version of your CV for embedding

# ── Notification routing ────────────────────────────────────────────────────
notifications:
  email:
    enabled: true
    daily_digest_hour: 8        # 24h, when to send the daily summary (Irish time)
    instant_runs: true          # also send each hourly batch as email
  telegram:
    enabled: true
    only_above_threshold: true  # only send Telegram for high-relevance jobs
